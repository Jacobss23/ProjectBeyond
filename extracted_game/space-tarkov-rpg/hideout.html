<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schron</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Redaction+50:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="transition-overlay"></div>

    <div id="game-container" class="wide xl">
      <!-- === EKRAN: SCHRON GŁÓWNY === -->
      <div id="hub-main" class="screen active">
        <h2 id="hub-title">Schron</h2>
        <div class="hub-top">
          <div class="art portrait">[Portret postaci]</div>
          <div id="hub-status"></div>
        </div>
        <div class="hub-grid">
          <button onclick="goTo('hub-raid')">Rajd</button>
          <button onclick="goTo('hub-inv')">Ekwipunek</button>
          <button onclick="goTo('hub-trader')">Handlarze</button>
          <button onclick="goTo('hub-ship')">Statek</button>
          <button onclick="rest()">Odpocznij</button>
          <button onclick="window.location.href = 'index.html'" class="back-btn" style="margin: 0">Menu główne</button>
        </div>
      </div>

      <!-- === EKRAN: WYBÓR RAJDU === -->
      <div id="hub-raid" class="screen hidden">
        <h2>Wybierz rajd</h2>
        <div id="raid-list"></div>
        <button onclick="goTo('hub-main')" class="back-btn">Wróć</button>
      </div>

      <!-- === EKRAN: EKWIPUNEK === -->
      <div id="hub-inv" class="screen hidden">
        <h2>Ekwipunek</h2>
        <div class="inv-layout">
          <div class="panel scroll">
            <h3>Magazyn <small id="stash-info"></small></h3>
            <div id="stash-grid"></div>
          </div>
          <div class="inv-side">
            <div class="panel">
              <h3>Zestaw na rajd <small id="load-info"></small></h3>
              <div id="load-grid"></div>
              <div class="btn-row" style="margin-top: 8px">
                <button class="sm" onclick="repeatLoadout()">Powtórz ostatni</button>
                <button class="sm ghost" onclick="clearLoadout()">Odłóż wszystko</button>
              </div>
            </div>
            <div id="inv-info" class="panel item-info"></div>
          </div>
        </div>
        <button onclick="goTo('hub-main')" class="back-btn">Wróć</button>
      </div>

      <!-- === EKRAN: HANDLARZE === -->
      <div id="hub-trader" class="screen hidden">
        <h2>Handlarze</h2>
        <div id="trader-tabs" class="btn-row"></div>
        <div id="trader-desc" class="hint"></div>
        <div id="trader-credits"></div>
        <div class="inv-layout">
          <div class="panel">
            <h3>Kup</h3>
            <div id="trader-buy"></div>
          </div>
          <div class="panel scroll">
            <h3>Sprzedaj (magazyn)</h3>
            <div id="sell-grid"></div>
          </div>
          <div id="sell-info" class="panel item-info"></div>
        </div>
        <button onclick="goTo('hub-main')" class="back-btn">Wróć</button>
      </div>

      <!-- === EKRAN: STATEK === -->
      <div id="hub-ship" class="screen hidden">
        <h2>Statek</h2>
        <div id="ship-list"></div>
        <button onclick="goTo('hub-main')" class="back-btn">Wróć</button>
      </div>

      <!-- === EKRAN: MODUŁ === -->
      <div id="hub-module" class="screen hidden">
        <h2 id="module-title">Moduł</h2>
        <p id="module-desc"></p>
        <div id="module-recipes" class="panel"></div>
        <button onclick="goTo('hub-ship')" class="back-btn">Wróć</button>
      </div>

      <!-- === TERMINAL === -->
      <div id="log" class="log small"></div>
    </div>

    <script src="data/items.js"></script>
    <script src="data/ship.js"></script>
    <script src="data/traders.js"></script>
    <script src="data/maps.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/save.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/hideout.js"></script>
  </body>
</html>
