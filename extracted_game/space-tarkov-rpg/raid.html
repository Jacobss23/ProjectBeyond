<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rajd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Redaction+50:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="transition-overlay"></div>

    <div id="game-container" class="wide xl">
      <div id="raid-screen" class="screen active">
        <div class="raid-head">
          <h2 id="loc-name"></h2>
          <div class="raid-stats">
            <div class="bar"><span id="hp-bar"></span><em id="hp-text"></em></div>
            <div id="storm-text"></div>
          </div>
        </div>

        <div class="raid-layout">
          <div class="raid-left">
            <div id="art" class="art"></div>
            <div id="objectives" class="objectives" style="display: none"></div>
            <div id="log" class="log"></div>
            <div id="actions" class="actions"></div>
          </div>

          <div class="raid-right">
            <div class="panel">
              <h3>Plecak <small id="bag-info"></small></h3>
              <div id="bag-grid"></div>
            </div>
            <div class="panel">
              <h3>Ziemia</h3>
              <div id="ground-grid"></div>
              <button id="take-all" class="sm" style="margin-top: 8px">Zabierz wszystko</button>
            </div>
            <div id="item-info" class="panel item-info"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="data/items.js"></script>
    <script src="data/ship.js"></script>
    <script src="data/enemies.js"></script>
    <script src="data/maps.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/save.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/raid.js"></script>
  </body>
</html>
