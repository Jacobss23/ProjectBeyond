<!doctype html>
<html lang="pl">
  <!-- === SEKCJA: HEAD === -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Tarkov RPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Redaction+50:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <!-- === SEKCJA: BODY === -->
  <body>
    <!-- === OVERLAY ANIMACJI === -->
    <div id="transition-overlay"></div>

    <!-- === KONTENER GRY === -->
    <div id="game-container">
      <!-- === EKRAN: MENU GŁÓWNE === -->
      <div id="main-menu" class="screen active">
        <h1 class="title">PROJECT: BEYOND</h1>
        <div class="menu-buttons">
          <button onclick="showScreen('saves-screen')">Graj</button>
          <button onclick="showScreen('settings-screen')">Ustawienia</button>
          <button onclick="showScreen('info-screen')">Info</button>
        </div>
      </div>

      <!-- === EKRAN: WYBÓR ZAPISU === -->
      <div id="saves-screen" class="screen hidden">
        <h2>Wybierz Zapis</h2>
        <div class="save-slots" id="slots-container">
          <button onclick="loadSlot(1)" id="btn-slot-1">Slot 1 - Pusty</button>
          <button onclick="loadSlot(2)" id="btn-slot-2">Slot 2 - Pusty</button>
          <button onclick="loadSlot(3)" id="btn-slot-3">Slot 3 - Pusty</button>
        </div>
        <button onclick="showScreen('main-menu')" class="back-btn">Wróć</button>
      </div>

      <!-- === EKRAN: USTAWIENIA === -->
      <div id="settings-screen" class="screen hidden">
        <h2>Ustawienia</h2>
        <p>Opcje pojawią się tutaj.</p>
        <button onclick="showScreen('main-menu')" class="back-btn">Wróć</button>
      </div>

      <!-- === EKRAN: INFO === -->
      <div id="info-screen" class="screen hidden">
        <h2>Info</h2>
        <p>Text-based survival RPG w kosmosie.</p>
        <button onclick="showScreen('main-menu')" class="back-btn">Wróć</button>
      </div>
    </div>

    <!-- === SKRYPTY === -->
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
